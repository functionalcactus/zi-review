function renderToday(){
  const now=Date.now(),c=counts(now),d=new Date(now);
  const zhDate=`${d.getMonth()+1}月${d.getDate()}日 星期${'日一二三四五六'[d.getDay()]}`;
  const total=c.due+c.learn+c.fresh;
  const mins=Math.max(1,Math.round(total*10/60));
  let main;
  if(total){
    const parts=[];
    if(c.due) parts.push(`<b>${c.due}</b> ${c.due===1?'review':'reviews'}`);
    if(c.fresh) parts.push(`<b>${c.fresh}</b> new ${c.fresh===1?'card':'cards'}`);
    if(c.learn) parts.push(`<b>${c.learn}</b> still learning`);
    main=`<div><p>${parts.join(', ').replace(/, ([^,]*)$/,' and $1')}</p><p class="muted" style="margin-top:6px">All lessons, about ${mins} min</p></div><button class="btn primary" id="start">Study all</button>`;
  } else {
    const tomorrow=items().filter(it=>{const st=srs[it.key];return st&&st.due<=endOfDay(now+DAY)}).length;
    main=`<div><p>You're done for today.</p><p class="muted" style="margin-top:6px">${tomorrow?`${tomorrow} ${tomorrow===1?'card is':'cards are'} due tomorrow.`:'Add a deck in Settings to get more cards.'}</p></div><button class="btn" data-go="words">Browse words</button>`;
  }
  const days=studiedDays(),today=startOfDay(now);let stamps='',labels='';
  for(let i=13;i>=0;i--){const t=startOfDay(today-i*DAY+HOUR*2);const on=days.has(t);
    stamps+=`<div class="stamp ${on?'on':''} ${i===0?'today':''}" title="${new Date(t).toDateString()}">${on?'学':''}</div>`;
    labels+=`<span>${new Date(t).getDate()}</span>`;}
  const st=streak();
  $('#main').innerHTML=`
    <h1 class="zh">${zhDate}</h1>
    <p class="sub">${d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</p>
    <section class="sheet today-main">${main}</section>
    <h2>Lessons</h2>
    <div class="decks">${deckRows()}</div>
    <h2>Study days</h2>
    <div class="stamps">${stamps}</div><div class="stamp-days">${labels}</div>
    <p class="muted">${st?`${st}-day streak`:'Review today to start a streak.'}</p>
    ${log.length&&Date.now()-(settings.lastBackup||0)>14*DAY?`<p class="muted" style="margin-top:20px">${settings.lastBackup?'Your last backup is over two weeks old.':'You haven\'t backed up your progress yet.'} <button class="btn small" data-go="settings">Back up in Settings</button></p>`:''}`;
  $('#start')?.addEventListener('click',()=>openReview(null));
  for(const b of document.querySelectorAll('[data-study]')) b.addEventListener('click',()=>openReview(b.dataset.study));
}
function deckRows(){
  const by={},now=Date.now();
  for(const it of items()){const k=it.note.deck;(by[k]??={n:0,done:0});by[k].n++;const st=srs[it.key];if(st&&st.state===2)by[k].done++;}
  const ds=decks();
  if(!ds.length) return `<div class="sheet empty">No lessons yet. Import one in Settings.</div>`;
  return ds.map(d=>{
    const b=by[d.deck]||{n:0,done:0};const p=b.n?Math.round(b.done/b.n*100):0;
    const c=counts(now,d.deck);const parts=[];
    if(c.due) parts.push(`${c.due} to review`);
    if(c.fresh) parts.push(`${c.fresh} new`);
    if(c.learn) parts.push(`${c.learn} learning`);
    const any=c.due+c.fresh+c.learn;
    return `<div class="deck"><div><strong>${esc(d.deck)}</strong><span class="muted deck-sub">${any?parts.join(', '):'Done for today'}. ${p}% learned.</span></div><button class="btn small ${any?'go':''}" data-study="${esc(d.deck)}" ${any?'':'disabled'}>Study</button><div class="bar"><i style="width:${p}%"></i></div></div>`;
  }).join('');
}

  $('#list').innerHTML=ns.length?ns.map(n=>{
    const keys=n.type==='grammar'?[n.id+'#c']:[n.id+'#r',n.id+'#w',n.id+'#h'].filter(k=>srs[k]||k.endsWith('#r'));
    const sts=keys.map(k=>status(srs[k]));
    const s=sts.includes('learning')?'learning':sts.every(x=>x==='mature')?'mature':sts.some(x=>x!=='new')?'young':'new';
    const label={new:'New',learning:'Learning',young:'Learned',mature:'Mature'}[s];

    return wrap(`<button class="row" aria-expanded="false" data-say="${esc(n.hanzi)}"><span class="hz">${esc(n.hanzi)}</span><span><span class="py">${pyHTML(n.pinyin)}</span><br><span class="mn">${esc(n.meaning)}</span></span><span class="status ${s}">${label}</span></button>`);
  }).join(''):`<div class="empty">No words match "${esc(wordsQuery)}".</div>`;

    const d=r.nextElementSibling,open=d.hidden;d.hidden=!open;r.setAttribute('aria-expanded',open);
  });

let progDeck='all';
function renderProgress(){
  const now=Date.now(),today=startOfDay(now);
  if(progDeck!=='all'&&!decks().some(d=>d.deck===progDeck)) progDeck='all';
  const its=items().filter(it=>progDeck==='all'||it.note.deck===progDeck);
  const lg=log.filter(e=>progDeck==='all'||deckOf(e.k)===progDeck);
  const tally={new:0,learning:0,young:0,mature:0};
  for(const it of its) tally[status(srs[it.key])]++;
  const recent=lg.filter(e=>e.p===2&&e.t>=now-30*DAY);
  const ret=recent.length?Math.round(recent.filter(e=>e.g>1).length/recent.length*100)+'%':'–';
  const per=Array(14).fill(0);for(const e of lg){const i=Math.round((today-startOfDay(e.t))/DAY);if(i>=0&&i<14) per[13-i]++;}
  const fc=Array(14).fill(0);for(const it of its){const st=srs[it.key];if(st&&st.state===2){const i=Math.max(0,Math.round((startOfDay(st.due)-today)/DAY));if(i<14) fc[i]++;}}
  const bars=(arr,cls)=>{const m=Math.max(1,...arr);return `<div class="chart ${cls||''}">${arr.map(v=>`<div>${v||''}<i style="height:${v/m*100}%"></i></div>`).join('')}</div>`;};

    <div class="stats" style="margin-top:10px">
      <div class="stat"><b>${tally.young+tally.mature}</b><span>Cards learned</span></div>
      <div class="stat"><b>${tally.mature}</b><span>Mature (21+ day interval)</span></div>
      <div class="stat"><b>${ret}</b><span>Recall rate, last 30 days</span></div>
      <div class="stat"><b>${streak()}</b><span>Day streak</span></div>
    </div>
    <h2>Reviews per day</h2>${bars(per)}${axis(i=>new Date(today-(13-i)*DAY+HOUR*2).getDate())}
    <h2>Due in the next two weeks</h2>${bars(fc,'blue')}${axis(i=>i===0?'Now':new Date(today+i*DAY+HOUR*2).getDate())}
    <h2>All cards</h2>
    <div class="stats">
      <div class="stat"><b>${tally.new}</b><span>Not started</span></div>
      <div class="stat"><b>${tally.learning}</b><span>Learning</span></div>
      <div class="stat"><b>${tally.young}</b><span>Learned (under 21 days)</span></div>
      <div class="stat"><b>${tally.mature}</b><span>Mature</span></div>
    </div>`;
  for(const b of document.querySelectorAll('[data-pdeck]')) b.addEventListener('click',()=>{progDeck=b.dataset.pdeck;renderProgress();});
}

/* ---------- Import / export ---------- */
let fileMode='deck';
function pickFile(mode){fileMode=mode;$('#file').value='';$('#file').click();}
$('#file').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f) return;
  let data;try{data=JSON.parse(await f.text());}catch(err){return toast('That file is not valid JSON.');}
  if(fileMode==='backup'){
    if(!data||!data.srs) return toast('That file is not a Zi Review backup.');
    if(!confirm('Replace progress on this device with the backup?')) return;
    srs=data.srs;log=data.log||[];if(Array.isArray(data.dict)){dictHist=data.dict;saveDict();}userDecks=data.decks||[];settings=Object.assign(settings,data.settings||{});
    save();saveDecks();saveSettings();invalidate();render();return toast('Backup restored.');
  }
  const list=Array.isArray(data)?data:data.decks?data.decks:[data];
  let added=0;
  for(const d of list){
    if(!d||!d.deck||!Array.isArray(d.cards)) continue;
    const cards=d.cards.filter(c=>c&&((c.hanzi&&c.meaning)||(c.type==='grammar'&&c.sentence&&c.answer&&c.sentence.includes('__'))));
    const i=userDecks.findIndex(x=>x.deck===d.deck);
    if(i>=0) userDecks[i]={deck:d.deck,cards}; else userDecks.push({deck:d.deck,cards});
    added+=cards.length;
  }
  if(!added) return toast('No cards found. Check the deck file format in Settings.');
  saveDecks();invalidate();render();toast(`Imported ${added} cards.`);
});
function exportBackup(){
  const blob=new Blob([JSON.stringify({app:'zi-review',version:1,exported:new Date().toISOString(),settings,decks:userDecks,srs,log,dict:dictHist})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`zi-review-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  settings.lastBackup=Date.now();saveSettings();if(view==='settings') renderSettings();
}

/* ---------- Review session ---------- */
let session={done:0,correct:0,history:[],cur:null,revealed:false};
function openReview(deck){session={deck:deck||null,done:0,correct:0,history:[],cur:null,revealed:false};session.startLeft=remaining();$('#review').hidden=false;document.body.classList.add('locked');nextCard();}
function closeReview(){$('#review').hidden=true;document.body.classList.remove('locked');speechSynthesis?.cancel?.();render();}
function remaining(){const c=counts(Date.now(),session.deck);return c.due+c.learn+c.fresh;}
function nextCard(){session.cur=nextItem(Date.now());session.revealed=false;session.hw=null;session.cur?renderCard():renderDone();}
function sayText(it){const n=it.note;return n.type==='grammar'?fillText(n):n.hanzi;}
function renderCard(){
  const it=session.cur,n=it.note,rev=session.revealed,left=remaining();
  const pct=session.startLeft?Math.min(100,session.done/(session.done+left)*100):0;
  let face='';
  if(it.dir==='h'&&!rev){
    return renderHand(it);
  }
  if(it.dir==='h'){
    face=`<p class="prompt">${esc(n.meaning)}</p>`+cellsHTML(n.hanzi,n.pinyin,{show:true,color:true,pinyin:true});
    const hw=session.hw||{};const v=handVerdict(hw);

/* ---------- Handwriting ---------- */
function handVerdict(hw){
  if(hw.gaveUp) return 1;

      ${chars.length>1?`<div class="mini">${mini}</div>`:''}
      <div class="cell hwcell" id="hw" style="--c:${size}px;font-size:0">${GRID}</div>
      <p class="hw-status" id="hw-status">${chars.length>1?`Character ${hw.idx+1} of ${chars.length}. `:''}${hw.mistakes?`${hw.mistakes} ${hw.mistakes===1?'mistake':'mistakes'} so far.`:'Write it stroke by stroke.'}</p>
    </div>
    <div class="rv-bottom"><div class="hw-actions"><button class="btn" id="hw-show">Stroke order</button><button class="btn" id="rv-reveal">Show answer</button></div><div class="keys">Space to show answer</div></div>`;

  const w=HanziWriter.create('hw',ch,{
    width:size-4,height:size-4,padding:Math.round(size*.06),
    showCharacter:false,showOutline:false,
    strokeColor:cssVar('--ink'),outlineColor:cssVar('--grid-soft'),drawingColor:cssVar('--t3'),highlightColor:cssVar('--seal'),
    drawingWidth:Math.max(14,Math.round(size/14)),showHintAfterMisses:3,highlightOnComplete:true,
    strokeAnimationSpeed:1.4,delayBetweenStrokes:120,

  const startQuiz=()=>w.quiz({

      setTimeout(()=>{

function grade(g){
  const it=session.cur,now=Date.now(),prev=srs[it.key];
  session.history.push({hw:session.hw,key:it.key,prev:prev?{...prev}:undefined,logLen:log.length,done:session.done,correct:session.correct,item:it});
  srs[it.key]=schedule(prev,g,now,settings.retention);
  log.push({t:now,k:it.key,g,p:prev?prev.state:0});
  if(log.length>50000) log=log.slice(-40000);
  session.done++;if(g>1) session.correct++;
  save();nextCard();
}
function undo(){
  const h=session.history.pop();if(!h) return;
  if(h.prev) srs[h.key]=h.prev; else delete srs[h.key];
  log.length=Math.min(log.length,h.logLen);session.done=h.done;session.correct=h.correct;
  session.cur=h.item;session.hw=h.hw;session.revealed=true;save();renderCard();
}
function renderDone(){

  const acc=session.done?Math.round(session.correct/session.done*100):0;

      ${session.done?`<p class="sub">${session.done} ${session.done===1?'card':'cards'} reviewed, ${acc}% remembered.</p>`:''}
      ${next?`<p class="muted">Cards you're still learning come back in ${fmtIvl(Math.max(MIN,next-now))}.</p>`:''}
      <button class="btn primary" id="rv-back" style="margin-top:20px">Back to today</button>
    </div>`;
  $('#rv-close').onclick=closeReview;$('#rv-back').onclick=closeReview;
}
document.addEventListener('keydown',e=>{
  if($('#review').hidden||e.metaKey||e.ctrlKey||e.altKey) return;

function bindScope(st,all,rerender,onChange){

// Tap to toggle. Swipe sideways to start a range selection (like the Photos app), then drag in any direction.
(function(){
  let pid=null,dragging=false,anchor=-1,mode=true,base=null,last=-1,sx=0,sy=0,px=0,py=0,raf=0;
  const tileAt=(x,y)=>{const el=document.elementFromPoint(x,y);const t=el&&el.closest&&el.closest('#pg .tile');return t?+t.dataset.i:-1;};
  const apply=i=>{
    if(!PICK||i<0||i===last) return;last=i;
    const {st,all}=PICK,a=Math.min(anchor,i),b=Math.max(anchor,i);
    all.forEach((n,k)=>{const want=(k>=a&&k<=b)?mode:base.has(n.id);if(want) st.picked.add(n.id);else st.picked.delete(n.id);});
    paintPicker();
  };
  const loop=()=>{
    if(!dragging){raf=0;return;}
    const edge=90,bottomEdge=window.innerHeight-(window.innerWidth<=820?170:90);
    let dy=0;if(py<edge) dy=-Math.ceil((edge-py)/6);else if(py>bottomEdge) dy=Math.ceil((py-bottomEdge)/6);
    if(dy){window.scrollBy(0,dy);apply(tileAt(px,py));}
    raf=requestAnimationFrame(loop);
  };
  const begin=()=>{dragging=true;apply(anchor);if(!raf) raf=requestAnimationFrame(loop);};
  const toggle=i=>{const {st,all}=PICK,id=all[i].id;if(st.picked.has(id)) st.picked.delete(id);else st.picked.add(id);paintPicker();};
  document.addEventListener('pointerdown',e=>{
    if(!PICK) return;const t=e.target.closest&&e.target.closest('#pg .tile');if(!t) return;
    pid=e.pointerId;anchor=+t.dataset.i;last=-1;sx=px=e.clientX;sy=py=e.clientY;dragging=false;
    base=new Set(PICK.st.picked);mode=!PICK.st.picked.has(PICK.all[anchor].id);
    if(e.pointerType==='mouse'){e.preventDefault();begin();}
  });
  window.addEventListener('pointermove',e=>{
    if(pid!==e.pointerId) return;px=e.clientX;py=e.clientY;
    if(!dragging){
      const dx=Math.abs(e.clientX-sx),dy=Math.abs(e.clientY-sy);
      if(dx>8&&dx>dy) begin();else if(dy>10){pid=null;return;}else return;
    }
    apply(tileAt(px,py));
  });
  window.addEventListener('pointerup',e=>{
    if(pid!==e.pointerId) return;
    if(!dragging&&PICK) toggle(anchor);
    pid=null;dragging=false;
  });
  window.addEventListener('pointercancel',e=>{if(pid===e.pointerId){pid=null;dragging=false;}});
  document.addEventListener('click',e=>{ // keyboard (Enter/Space) only
    if(e.detail!==0||!PICK) return;const t=e.target.closest&&e.target.closest('#pg .tile');if(t) toggle(+t.dataset.i);
  });
})();

  $('#fc-learn').onclick=()=>sortFlash(false);
  $('#fc-know').onclick=()=>sortFlash(true);
  const sw=$('#fcs'),tl=$('#fct-l'),tr=$('#fct-r');
  let down=false,moved=false,sx=0,sy=0,dx=0;
  sw.onpointerdown=e=>{if(e.target.closest('.exb')) return;down=true;moved=false;sx=e.clientX;sy=e.clientY;dx=0;sw.setPointerCapture?.(e.pointerId);sw.style.transition='none';};
  sw.onpointermove=e=>{
    if(!down) return;dx=e.clientX-sx;const dy=e.clientY-sy;
    if(Math.abs(dx)>8||Math.abs(dy)>8) moved=true;
    if(!moved) return;
    sw.style.transform=`translateX(${dx}px) rotate(${dx/20}deg)`;
    tl.style.opacity=Math.min(1,Math.max(0,-dx/90));tr.style.opacity=Math.min(1,Math.max(0,dx/90));
  };
  const up=()=>{
    if(!down) return;down=false;sw.style.transition='';
    if(!moved){flipFlash();return;}
    if(Math.abs(dx)>90) sortFlash(dx>0);
    else {sw.style.transform='';tl.style.opacity=0;tr.style.opacity=0;}
  };
  sw.onpointerup=up;sw.onpointercancel=()=>{down=false;sw.style.transition='';sw.style.transform='';tl.style.opacity=0;tr.style.opacity=0;};
}
function flipFlash(){if(!fsn) return;fsn.flipped=!fsn.flipped;$('#fcc')?.classList.toggle('flipped',fsn.flipped);}
function sortFlash(know){
  const f=fsn;if(!f||f.busy) return;f.busy=true;
  const n=f.queue[f.i],sw=$('#fcs');
  (know?f.know:f.learn).push(n);f.hist.push(know);
  const tag=$(know?'#fct-r':'#fct-l');if(tag) tag.style.opacity=1;
  if(sw){sw.style.transition='transform .22s ease-in';sw.style.transform=`translateX(${know?'':'-'}130vw) rotate(${know?18:-18}deg)`;}
  setTimeout(()=>{if(fsn!==f) return;f.busy=false;f.i++;f.flipped=false;renderFlashCard();},matchMedia('(prefers-reduced-motion: reduce)').matches?0:200);
}
function undoFlash(){
  const f=fsn;if(!f||!f.hist.length) return;
  const know=f.hist.pop();(know?f.know:f.learn).pop();f.i--;f.flipped=false;renderFlashCard();
}
function renderFlashEnd(){
  const f=fsn,total=f.know.length+f.learn.length;
  $('#flash').innerHTML=`
    <div class="rv-top"><button class="icon-btn" id="fc-close" aria-label="Close">${ICON.close}</button><div class="left">Flashcards${f.round>1?`, round ${f.round}`:''}</div></div>
    <div class="rv-body" style="text-align:left;align-items:stretch;max-width:640px;width:100%;margin:0 auto">
      <div class="score"><b>${f.know.length}</b><span>/ ${total}</span></div>
      <p class="sub" style="text-align:center">${f.learn.length?`You know ${f.know.length} of ${total}. ${f.learn.length} still to learn.`:'You know every card in this set.'}</p>
      ${f.learn.length?`<h2 style="margin-top:24px">Still learning</h2><div class="list">${f.learn.map(n=>`<div class="item"><div class="row dres"><span class="hz">${esc(n.hanzi)}</span><span><span class="py">${pyHTML(n.pinyin)}</span><br><span class="mn">${esc(n.meaning)}</span></span><span></span></div></div>`).join('')}</div>`:''}
    </div>
    <div class="rv-bottom"><div class="hw-actions">${f.learn.length?`<button class="btn primary" id="fc-again">Review ${f.learn.length} again</button>`:`<button class="btn primary" id="fc-restart">Go through all again</button>`}<button class="btn" id="fc-done">Done</button></div></div>`;
  $('#flash').scrollTop=0;
  $('#fc-close').onclick=quitFlash;$('#fc-done').onclick=quitFlash;
  const a=$('#fc-again');if(a) a.onclick=()=>startFlash(f.learn,f.round+1);
  const r=$('#fc-restart');if(r) r.onclick=()=>startFlash(f.queue,1);
}
document.addEventListener('keydown',e=>{
  if($('#flash').hidden||!fsn||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==='Escape') return quitFlash();
  if(fsn.i>=fsn.queue.length) return;
  if(e.key===' '||e.key==='Enter'){e.preventDefault();flipFlash();}
  else if(e.key==='ArrowRight') sortFlash(true);
  else if(e.key==='ArrowLeft') sortFlash(false);
  else if(e.key==='z'||e.key==='u') undoFlash();
  else if(e.key==='s'||e.key==='S') speak(fsn.queue[fsn.i].hanzi);
});

/* Test */
function startDict(words){
  const list=dict.shuffle?shuffled([...words]):[...words];
  test={mode:dict.mode,items:list.map(n=>({n,result:null,mistakes:0})),i:0,ci:0,answer:false};
  $('#dict').hidden=false;document.body.classList.add('locked');renderDictCard();
}
function quitDict(force){
  if(!force&&test&&!test.done&&test.i>0&&!confirm('End this test? It won\'t be saved.')) return;
  test=null;$('#dict').hidden=true;document.body.classList.remove('locked');speechSynthesis?.cancel?.();render();
}
function dictTop(){
  const t=test,it=t.items[t.i];
  return `<div class="progress-line"><i style="width:${t.i/t.items.length*100}%"></i></div>
    <div class="rv-top">
      <button class="icon-btn" id="dt-close" aria-label="End test">${ICON.close}</button>
      <div class="left">听写 ${Math.min(t.i+1,t.items.length)} of ${t.items.length}</div>
      ${t.mode==='pinyin'||t.answer?`<button class="icon-btn" id="dt-say" aria-label="Play sound">${ICON.sound}</button>`:''}
    </div>`;
}
function renderDictCard(){
  const t=test;if(!t) return;
  if(t.i>=t.items.length) return finishDict();
  const it=t.items[t.i],n=it.n,chars=[...n.hanzi].filter(isHan);
  const box=$('#dict');
  if(t.answer){
    box.innerHTML=`${dictTop()}
      <div class="rv-body">
        <p class="prompt" style="margin-bottom:10px;font-size:clamp(20px,4.5vw,26px)">${esc(n.meaning)}</p>
        ${cellsHTML(n.hanzi,n.pinyin,{show:true,color:true,pinyin:true})}
        <p class="verdict">${it.result==='miss'?'Marked as didn\'t know.':''}</p>
      </div>
      <div class="rv-bottom"><button class="btn primary reveal" id="dt-next">${t.i+1<t.items.length?'Next word':'See results'}</button><div class="keys">Enter for next</div></div>`;
    $('#dt-next').onclick=()=>{t.answer=false;t.i++;t.ci=0;renderDictCard();};
  } else {
    const size=Math.floor(Math.max(200,Math.min(340,window.innerWidth-40,window.innerHeight-(chars.length>1?400:340))));
    const mini=chars.map((c,i)=>`<div class="cell ${i===t.ci?'now':''}">${GRID}<span>${i<t.ci?esc(c):''}</span></div>`).join('');
    const prompt=t.mode==='pinyin'
      ?`<div class="dict-py">${pyHTML(n.pinyin)}</div>`
      :`<p class="prompt" style="margin-bottom:6px;font-size:clamp(20px,4.5vw,26px)">${esc(n.meaning)}</p>`;
    box.innerHTML=`${dictTop()}
      <div class="rv-body">
        ${prompt}
        ${chars.length>1?`<div class="mini">${mini}</div>`:'<div style="height:10px"></div>'}
        <div class="cell hwcell" id="dhw" style="--c:${size}px;font-size:0">${GRID}</div>
        <p class="hw-status">${chars.length>1?`Character ${t.ci+1} of ${chars.length}`:'&nbsp;'}</p>
      </div>
      <div class="rv-bottom"><button class="btn reveal" id="dt-idk">I don't know</button></div>`;
    const w=HanziWriter.create('dhw',chars[t.ci],{
      width:size-4,height:size-4,padding:Math.round(size*.06),
      showCharacter:false,showOutline:false,showHintAfterMisses:false,highlightOnComplete:true,
      strokeColor:cssVar('--ink'),outlineColor:cssVar('--grid-soft'),drawingColor:cssVar('--t3'),highlightColor:cssVar('--t2'),
      drawingWidth:Math.max(14,Math.round(size/14)),charDataLoader:(c,done)=>done(STROKES[c])
    });
    const thisItem=it;
    w.quiz({
      onMistake:()=>{thisItem.mistakes++;},
      onComplete:()=>setTimeout(()=>{
        if(!test||test.items[test.i]!==thisItem) return;
        t.ci++;
        if(t.ci<chars.length) return renderDictCard();
        thisItem.result=thisItem.mistakes<=chars.length?'right':'shaky';
        t.i++;t.ci=0;renderDictCard();
      },500)
    });
    $('#dt-idk').onclick=()=>{w.cancelQuiz();it.result='miss';t.answer=true;renderDictCard();};
  }
  $('#dt-close').onclick=()=>quitDict();
  const s=$('#dt-say');if(s) s.onclick=()=>speak(n.hanzi);
}
function finishDict(){
  const t=test;t.done=true;
  const items=t.items.map(x=>({id:x.n.id,deck:x.n.deck,hanzi:x.n.hanzi,pinyin:x.n.pinyin,meaning:x.n.meaning,result:x.result||'miss',mistakes:x.mistakes}));
  const rec={t:Date.now(),mode:t.mode,total:items.length,right:items.filter(x=>x.result==='right').length,items};
  dictHist.unshift(rec);if(dictHist.length>300) dictHist.length=300;saveDict();
  renderDictResult(rec,true);
}
function resultRows(items){
  return `<div class="list">${items.map(x=>`<div class="item"><div class="row dres"><span class="hz">${esc(x.hanzi)}</span><span><span class="py">${pyHTML(x.pinyin)}</span><br><span class="mn">${esc(x.meaning)}</span></span><span class="status r-${x.result}">${RES[x.result]}${x.result!=='miss'&&x.mistakes?` (${x.mistakes})`:''}</span></div></div>`).join('')}</div>`;
}
function renderDictResult(rec,fresh){
  const wrong=rec.items.filter(x=>x.result!=='right');
  const shaky=rec.items.filter(x=>x.result==='shaky').length,miss=rec.items.filter(x=>x.result==='miss').length;
  $('#dict').innerHTML=`
    <div class="rv-top"><button class="icon-btn" id="dt-close" aria-label="Close">${ICON.close}</button><div class="left">听写 results</div></div>
    <div class="rv-body" style="text-align:left;align-items:stretch;max-width:640px;width:100%;margin:0 auto">
      <div class="score"><b>${rec.right}</b><span>/ ${rec.total}</span></div>
      <p class="sub" style="text-align:center">${rec.right===rec.total?'Every word correct.':[shaky?`${shaky} with many mistakes`:'',miss?`${miss} didn't know`:''].filter(Boolean).join(', ')+'.'}</p>
      <p class="muted" style="text-align:center;margin-top:4px">${rec.mode==='pinyin'?'Pinyin prompts':'Meaning prompts'}. Correct means at most one wrong stroke per character.</p>
      <div style="margin-top:20px">${resultRows([...wrong,...rec.items.filter(x=>x.result==='right')])}</div>
    </div>
    <div class="rv-bottom"><div class="hw-actions">${wrong.length?`<button class="btn primary" id="dt-retry">Retest ${wrong.length} missed</button>`:`<button class="btn primary" id="dt-done2">Done</button>`}<button class="btn" id="dt-hist">Past tests</button></div></div>`;
  $('#dict').scrollTop=0;
  $('#dt-close').onclick=()=>quitDict(true);
  $('#dt-hist').onclick=()=>{quitDict(true);wordsTab='dict';dict.view='history';go('words');};
  const d2=$('#dt-done2');if(d2) d2.onclick=()=>quitDict(true);
  const r=$('#dt-retry');if(r) r.onclick=()=>{
    const ids=new Set(wrong.map(x=>x.id));const words=dictWords().filter(n=>ids.has(n.id));
    dict.mode=rec.mode;if(words.length) startDict(words);
  };
}
function renderDictHistory(){
  const miss={};
  for(const r of dictHist) for(const x of r.items) if(x.result!=='right'){(miss[x.id]??={x,c:0}).c++;}
  const top=Object.values(miss).sort((a,b)=>b.c-a.c).slice(0,12);
  $('#main').innerHTML=`
    <h1>Words</h1>${segHTML()}
    <p style="margin:20px 0 0"><button class="btn small" id="dh-back">Back to 听写 setup</button></p>
    <h2>Past tests</h2>
    ${dictHist.length?`
      ${top.length?`<div class="sheet" style="padding:16px 18px;margin-bottom:16px"><strong>Most missed words</strong>
        <div class="missed">${top.map(m=>`<span class="mchip"><span class="hz">${esc(m.x.hanzi)}</span> ${m.c}×</span>`).join('')}</div>
        <button class="btn small" id="dh-test">Test these words</button></div>`:''}
      <div class="list">${dictHist.map((r,i)=>`<div class="item"><button class="row hrow" data-h="${i}" aria-expanded="${dict.open===i}"><span><strong>${r.right} / ${r.total}</strong></span><span><span class="mn">${new Date(r.t).toLocaleDateString(undefined,{month:'short',day:'numeric'})}, ${new Date(r.t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span><br><span class="muted">${r.mode==='pinyin'?'Pinyin':'Meaning'} prompts, ${[...new Set(r.items.map(x=>shortName(x.deck)))].join(' + ')}</span></span><span class="status ${r.right===r.total?'mature':r.right/r.total>=.7?'young':'learning'}">${Math.round(r.right/r.total*100)}%</span></button><div class="detail" ${dict.open===i?'':'hidden'}>${resultRows(r.items)}</div></div>`).join('')}</div>
      <p style="margin-top:20px"><button class="btn small danger" id="dh-clear">Clear test history</button></p>`
    :`<div class="sheet empty">No tests yet. Finish a 听写 and it will show up here.</div>`}`;
  bindSeg();
  $('#dh-back').onclick=()=>{dict.view='setup';renderDict();};
  for(const b of document.querySelectorAll('[data-h]')) b.onclick=()=>{const i=+b.dataset.h;dict.open=dict.open===i?null:i;renderDictHistory();};
  const tb=$('#dh-test');if(tb) tb.onclick=()=>{dict.picked=new Set(top.map(m=>m.x.id));dict.scope='pick';dict.view='setup';renderDict();window.scrollTo(0,0);};
  const cb=$('#dh-clear');if(cb) cb.onclick=()=>{if(confirm('Delete all past 听写 results? Study progress is not affected.')){dictHist=[];saveDict();renderDictHistory();}};
}
document.addEventListener('keydown',e=>{
  if($('#dict').hidden||!test||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==='Escape') return quitDict(test.done);
  if(e.key==='Enter'&&test.answer){e.preventDefault();$('#dt-next')?.click();}
});

/* ---------- Boot ---------- */
for(const b of document.querySelectorAll('.tab')) b.addEventListener('click',()=>go(b.dataset.view));
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g) go(g.dataset.go);const x=e.target.closest('.exb,.play');if(x) speak(x.dataset.say);});
if('speechSynthesis' in window){speechSynthesis.getVoices();speechSynthesis.addEventListener?.('voiceschanged',()=>{if(view==='settings'&&$('#review').hidden) renderSettings();});}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&$('#review').hidden) render();});
go('today');
if('serviceWorker' in navigator&&location.protocol==='https:'){
  const hadController=!!navigator.serviceWorker.controller;let reloading=false;
  // When a new version has been installed, reload once so it shows straight away.
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadController||reloading) return;reloading=true;if($('#review').hidden&&$('#dict').hidden&&$('#flash').hidden) location.reload();});
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
    reg.update().catch(()=>{});
    document.addEventListener('visibilitychange',()=>{if(!document.hidden) reg.update().catch(()=>{});});
  }).catch(()=>{});
}
if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
</script>
